name: SquareOps CI/CD

on:
  push:
    branches:
      - main

    paths:
      - "vote/**"

  pull_request:
    branches:
      - main

    paths:
      - "vote/**"

jobs:

  build-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      #################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      #################################################

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r vote/requirements.txt

      #################################################

      - name: Lint Python Code
        run: |
          flake8 vote

      #################################################

      - name: Install kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      #################################################

      - name: Lint Kubernetes Manifests
        run: |
          kubeconform -summary k8s-specifications/*.yaml

      #################################################

      - name: Build Docker Image

        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/vote-app:${{ github.sha }} \
            ./vote

      #################################################

      - name: Login to DockerHub

        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      #################################################

      - name: Push Image

        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/vote-app:${{ github.sha }}

      #################################################

      - name: Install Kind

        uses: helm/kind-action@v1

      #################################################

      - name: Install Helm

        uses: azure/setup-helm@v4

      #################################################

      - name: Deploy Application

        run: |

          helm upgrade --install voting-app \
          ./helm/voting-app \
          --namespace squareops \
          --create-namespace \
          --set vote.image.repository=${{ secrets.DOCKER_USERNAME }}/vote-app \
          --set vote.image.tag=${{ github.sha }}

      #################################################

      - name: Wait for Pods

        run: |

          kubectl wait \
          --for=condition=Ready pod \
          --all \
          -n squareops \
          --timeout=300s

      #################################################

      - name: Smoke Test

        run: |

          kubectl port-forward svc/vote 8080:80 -n squareops &

          sleep 10

          curl -f http://localhost:8080
